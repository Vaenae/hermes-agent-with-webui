name: Publish Hermes WebUI image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "hermes-webui/**"
      - ".github/workflows/publish-hermes-webui.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-hermes-webui-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/vaenae/hermes-webui

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Hermes WebUI with headless browser
            org.opencontainers.image.description=Hermes WebUI with Chromium, Node.js and agent-browser

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./hermes-webui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=hermes-webui
          cache-to: type=gha,mode=max,scope=hermes-webui
          sbom: true
          provenance: mode=max

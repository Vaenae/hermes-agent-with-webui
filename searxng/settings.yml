# SearXNG settings for the Hermes web stack.
#
# Only overrides live here. `use_default_settings: true` makes SearXNG load its
# own defaults first and deep-merge this file over them, so the engine list and
# everything else stay in step with the image tag — no 3000-line copy to maintain.
use_default_settings: true

general:
  instance_name: "Hermes SearXNG"
  donation_url: false
  contact_url: false

search:
  # Hermes' searxng provider calls /search?format=json. Upstream ships `[html]`
  # only, and a format that is not listed answers 403 rather than falling back —
  # so this is the setting the whole setup turns on.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

server:
  # Reachable only from the compose network, so the bot-protection limiter and
  # the public-instance flags stay off. Turning the limiter on additionally
  # requires the valkey service (see README).
  limiter: false
  public_instance: false
  # Overwritten by $SEARXNG_SECRET: the image's entrypoint rewrites secret_key
  # from that variable, which compose supplies from .env.
  secret_key: "overwritten-by-SEARXNG_SECRET"
  image_proxy: false
